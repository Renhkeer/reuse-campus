<header class="barra">
  <a routerLink="/" class="logo">♻ ReUse Campus</a>

  @if (sesion.usuario(); as u) {
    <nav>
      <a routerLink="/">Publicaciones</a>
      <a routerLink="/publicaciones/nueva">Publicar</a>
      <a routerLink="/mis-solicitudes">Mis solicitudes</a>
      <a routerLink="/entregas">Entregas</a>
      <!-- Solo el admin ve este link; la API igual rechaza a un usuario normal -->
      @if (sesion.esAdmin()) {
        <a routerLink="/usuarios">Usuarios</a>
      }
    </nav>
    <span class="usuario">
      {{ u.nombre }} ({{ u.rol }})
      <button class="secundario" (click)="salir()">Salir</button>
    </span>
  }
</header>

<main>
  <router-outlet />
</main>
